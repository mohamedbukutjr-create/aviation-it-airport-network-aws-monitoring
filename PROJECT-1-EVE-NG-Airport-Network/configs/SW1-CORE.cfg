!
! SW1-CORE - Airport L2 switch for EVE-NG lab
!
enable
configure terminal
hostname SW1-CORE
no ip domain-lookup
ip domain-name airport.local
service password-encryption
enable secret Airport123!
username admin privilege 15 secret Admin123!
!
vlan 10
 name CHECKIN
vlan 20
 name GATE
vlan 30
 name BAGGAGE
vlan 40
 name AIRPORT_OPS
vlan 50
 name IT_MGMT
vlan 60
 name GUEST_WIFI
vlan 70
 name SERVERS
!
interface GigabitEthernet0/0
 description TRUNK_TO_R1_AIRPORT_EDGE
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,60,70
 no shutdown
!
interface GigabitEthernet0/1
 description SRV_DNS_DHCP_VLAN70
 switchport mode access
 switchport access vlan 70
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/2
 description CHECKIN_PC1_VLAN10
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet0/3
 description GATE_PC1_VLAN20
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/0
 description BAG_SCANNER1_VLAN30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/1
 description BAG_PRINTER1_VLAN30
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/2
 description OPS_PC1_VLAN40
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet1/3
 description IT_ADMIN_PC_VLAN50
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 no shutdown
!
interface GigabitEthernet2/0
 description GUEST_WIFI_CLIENT_OR_AP_VLAN60
 switchport mode access
 switchport access vlan 60
 spanning-tree portfast
 no shutdown
!
interface Vlan50
 description SWITCH_MANAGEMENT
 ip address 10.10.50.2 255.255.255.0
 no shutdown
!
ip default-gateway 10.10.50.1
crypto key generate rsa modulus 1024
ip ssh version 2
line vty 0 15
 login local
 transport input ssh
!
end
write memory
