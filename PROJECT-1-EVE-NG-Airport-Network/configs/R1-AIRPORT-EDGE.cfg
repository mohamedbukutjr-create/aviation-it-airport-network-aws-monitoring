!
! R1-AIRPORT-EDGE - Router-on-a-stick for Airport IT EVE-NG lab
!
enable
configure terminal
hostname R1-AIRPORT-EDGE
no ip domain-lookup
ip domain-name airport.local
service password-encryption
enable secret Airport123!
username admin privilege 15 secret Admin123!
!
interface GigabitEthernet0/0
 description TRUNK_TO_SW1_CORE
 no shutdown
!
interface GigabitEthernet0/0.10
 description VLAN10_CHECKIN_GATEWAY
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip access-group CHECKIN-IN in
!
interface GigabitEthernet0/0.20
 description VLAN20_GATE_GATEWAY
 encapsulation dot1Q 20
 ip address 10.10.20.1 255.255.255.0
 ip access-group GATE-IN in
!
interface GigabitEthernet0/0.30
 description VLAN30_BAGGAGE_GATEWAY
 encapsulation dot1Q 30
 ip address 10.10.30.1 255.255.255.0
 ip access-group BAGGAGE-IN in
!
interface GigabitEthernet0/0.40
 description VLAN40_AIRPORT_OPS_GATEWAY
 encapsulation dot1Q 40
 ip address 10.10.40.1 255.255.255.0
!
interface GigabitEthernet0/0.50
 description VLAN50_IT_MGMT_GATEWAY
 encapsulation dot1Q 50
 ip address 10.10.50.1 255.255.255.0
!
interface GigabitEthernet0/0.60
 description VLAN60_GUEST_WIFI_GATEWAY
 encapsulation dot1Q 60
 ip address 10.10.60.1 255.255.255.0
 ip access-group GUEST-WIFI-IN in
!
interface GigabitEthernet0/0.70
 description VLAN70_SERVERS_GATEWAY
 encapsulation dot1Q 70
 ip address 10.10.70.1 255.255.255.0
!
! DHCP exclusions
ip dhcp excluded-address 10.10.10.1 10.10.10.20
ip dhcp excluded-address 10.10.20.1 10.10.20.20
ip dhcp excluded-address 10.10.30.1 10.10.30.60
ip dhcp excluded-address 10.10.40.1 10.10.40.20
ip dhcp excluded-address 10.10.50.1 10.10.50.20
ip dhcp excluded-address 10.10.60.1 10.10.60.20
ip dhcp excluded-address 10.10.70.1 10.10.70.30
!
ip dhcp pool VLAN10_CHECKIN
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1
 dns-server 10.10.70.10
 domain-name airport.local
!
ip dhcp pool VLAN20_GATE
 network 10.10.20.0 255.255.255.0
 default-router 10.10.20.1
 dns-server 10.10.70.10
 domain-name airport.local
!
ip dhcp pool VLAN30_BAGGAGE
 network 10.10.30.0 255.255.255.0
 default-router 10.10.30.1
 dns-server 10.10.70.10
 domain-name airport.local
!
ip dhcp pool VLAN40_AIRPORT_OPS
 network 10.10.40.0 255.255.255.0
 default-router 10.10.40.1
 dns-server 10.10.70.10
 domain-name airport.local
!
ip dhcp pool VLAN50_IT_MGMT
 network 10.10.50.0 255.255.255.0
 default-router 10.10.50.1
 dns-server 10.10.70.10
 domain-name airport.local
!
ip dhcp pool VLAN60_GUEST_WIFI
 network 10.10.60.0 255.255.255.0
 default-router 10.10.60.1
 dns-server 8.8.8.8
 domain-name guest.airport.local
!
ip dhcp pool VLAN70_SERVERS
 network 10.10.70.0 255.255.255.0
 default-router 10.10.70.1
 dns-server 10.10.70.10
 domain-name airport.local
!
! ACLs
ip access-list extended GUEST-WIFI-IN
 remark Guests cannot reach internal airline networks
 deny ip 10.10.60.0 0.0.0.255 10.10.0.0 0.0.255.255
 permit ip 10.10.60.0 0.0.0.255 any
!
ip access-list extended BAGGAGE-IN
 remark Baggage devices can reach servers and DNS, block guest/checkin/gate lateral access
 permit udp 10.10.30.0 0.0.0.255 host 10.10.70.10 eq 53
 permit tcp 10.10.30.0 0.0.0.255 host 10.10.70.30 eq 443
 permit icmp 10.10.30.0 0.0.0.255 10.10.70.0 0.0.0.255
 deny ip 10.10.30.0 0.0.0.255 10.10.60.0 0.0.0.255
 permit ip 10.10.30.0 0.0.0.255 any
!
ip access-list extended CHECKIN-IN
 remark Check-in can reach DCS and DNS; block guest network
 permit udp 10.10.10.0 0.0.0.255 host 10.10.70.10 eq 53
 permit tcp 10.10.10.0 0.0.0.255 host 10.10.70.20 eq 443
 deny ip 10.10.10.0 0.0.0.255 10.10.60.0 0.0.0.255
 permit ip 10.10.10.0 0.0.0.255 any
!
ip access-list extended GATE-IN
 permit udp 10.10.20.0 0.0.0.255 host 10.10.70.10 eq 53
 permit tcp 10.10.20.0 0.0.0.255 host 10.10.70.20 eq 443
 deny ip 10.10.20.0 0.0.0.255 10.10.60.0 0.0.0.255
 permit ip 10.10.20.0 0.0.0.255 any
!
crypto key generate rsa modulus 1024
ip ssh version 2
line vty 0 15
 login local
 transport input ssh
!
end
write memory
